<section class="services section" id="services" #section>
  <div class="container">
    <div class="section-head">
      <h2 class="section-title">Servicios</h2>
      <p class="section-lead">// Lo que puedo construir para tu negocio o tu equipo</p>
    </div>

    <div class="list">
      <article *ngFor="let item of listService" #article>
        <span class="icon-box"><i [ngClass]="item.icon" aria-hidden="true"></i></span>
        <h3>{{ item.title }}</h3>
      </article>
    </div>
  </div>
</section>
